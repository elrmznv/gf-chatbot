<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="GF Chatbot"/>
  <title>Golden Flowers Chatbot</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;background:#f5f0eb;color:#2a2a2a;display:flex;flex-direction:column;height:100vh}
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
    .dot{width:7px;height:7px;background:#d4a853;border-radius:50%;display:inline-block;animation:bounce 1s infinite}
    .dot:nth-child(2){animation-delay:.2s}
    .dot:nth-child(3){animation-delay:.4s}
    #header{background:#111111;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.2)}
    #logo-area{display:flex;align-items:center;gap:10px}
    #logo-area img{width:36px;height:36px;object-fit:contain}
    #logo-text{display:flex;flex-direction:column;line-height:1.1}
    #logo-name{font-family:Georgia,serif;font-size:15px;font-weight:700}
    #logo-name .g{color:#d4a853}
    #logo-name .f{color:#fff;margin-left:3px}
    #logo-sub{font-size:7px;color:#a0a8b8;letter-spacing:2px;text-transform:uppercase}
    #hdr-div{margin-left:8px;padding-left:12px;border-left:1px solid rgba(255,255,255,.15);font-size:10px;color:#8090a8}
    #stats{display:flex;gap:16px}
    .stat{text-align:center}
    .sv{font-size:13px;font-weight:700;color:#d4a853}
    .sl{font-size:7px;color:#8090a8;letter-spacing:1px;text-transform:uppercase}
    #main{display:flex;flex:1;overflow:hidden}
    #sidebar{width:170px;background:#fff;border-right:1px solid #e8e0d8;padding:14px 10px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;overflow-y:auto}
    .s-lbl{font-size:8px;color:#aaa;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;padding-left:8px}
    .ch-btn{background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#888;transition:all .2s;text-align:left;width:100%}
    .ch-btn.active{background:#f0ede8;border-color:#d4c5a9;color:#5a4a2a}
    .ch-btn:hover:not(.active){background:#f8f5f0}
    .ch-info{flex:1}
    .ch-name{font-size:11px;font-weight:600}
    .ch-cnt{font-size:9px;opacity:.6}
    .ch-bdg{background:#d4a853;border-radius:10px;padding:1px 5px;font-size:9px;font-weight:700;color:#fff;display:none}
    #op-card{margin-top:auto;background:#f8f5f0;border:1px solid #e8ddd0;border-radius:8px;padding:10px;flex-shrink:0;margin-top:12px}
    .op-lbl{font-size:8px;color:#bbb;letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
    .op-row{display:flex;align-items:center;gap:7px}
    .op-av{width:26px;height:26px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#d4a853;flex-shrink:0}
    .op-nm{font-size:11px;color:#5a4a2a;font-weight:600}
    .op-st{font-size:8px;color:#5aaa70}
    #chat{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#f9f6f2}
    #chat-hdr{padding:10px 16px;border-bottom:1px solid #e8e0d8;display:flex;align-items:center;gap:10px;background:#fff;flex-shrink:0}
    #ch-icon{font-size:18px}
    #ch-title{font-weight:600;font-size:13px;color:#3a2a1a}
    #ch-sub{font-size:10px;color:#aaa}
    #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
    #empty{text-align:center;margin:auto;opacity:.4;display:flex;flex-direction:column;align-items:center;gap:10px}
    .ei{width:52px;height:52px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .ei img{width:32px;height:32px;object-fit:contain}
    .et{font-size:12px;color:#999}
    .mrow{display:flex;gap:8px;align-items:flex-end}
    .mrow.u{justify-content:flex-end}
    .mav{width:28px;height:28px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#d4a853;flex-shrink:0}
    .mav.u{background:#e8e0d8;font-size:13px}
    .mbub{max-width:72%;display:flex;flex-direction:column}
    .mtxt{background:#fff;border:1px solid #e8e0d8;border-radius:14px 14px 14px 4px;padding:9px 13px;color:#3a2a1a;font-size:13px;line-height:1.55;box-shadow:0 1px 4px rgba(0,0,0,.06);word-break:break-word}
    .mtxt.u{background:linear-gradient(135deg,#d4a853,#c49040);border:none;border-radius:14px 14px 4px 14px;color:#fff}
    .mtime{font-size:9px;color:#bbb;margin-top:3px}
    .mtime.u{text-align:right}
    #typing-row{display:flex;gap:8px;align-items:flex-end}
    #typing-bub{background:#fff;border:1px solid #e8e0d8;border-radius:14px 14px 14px 4px;padding:11px 14px;display:flex;gap:4px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    #inp-area{padding:12px 16px;border-top:1px solid #e8e0d8;background:#fff;display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
    #msg-input{flex:1;background:#f5f0eb;border:1px solid #ddd5c8;border-radius:10px;padding:10px 14px;color:#3a2a1a;font-size:13px;resize:none;outline:none;line-height:1.5;font-family:inherit;max-height:100px}
    #msg-input::placeholder{color:#bbb}
    #send-btn{background:linear-gradient(135deg,#d4a853,#c49040);border:none;border-radius:10px;padding:10px 16px;cursor:pointer;color:#fff;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(212,168,83,.3);flex-shrink:0;transition:opacity .2s}
    #send-btn:disabled{background:#e8e0d8;color:#bbb;box-shadow:none;cursor:not-allowed}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
  </style>
</head>

<script>
var SYSTEM_PROMPT = "Ты виртуальный оператор компании Golden Flowers по имени Антон. Ты работаешь для сайта www.gfcc.ru.\n\nПРАВИЛА:\n1. Когда пользователь пишет приветствие, ВСЕГДА отвечай: \"Здравствуйте, вы общаетесь с оператором крупнейшей цветочной компании России — Антоном. Чем могу помочь?\"\n2. На вопросы о наличии товаров, цветов, растений: \"Вы можете посмотреть наличие в нашем мобильном приложении GF/Oasis.\"\n3. На вопросы о скидках: \"Если сумма вашей покупки превысит 25 000 рублей, вам предоставляется скидка 7%. Если оплата будет наличными — дополнительный бонус 5%.\"\n4. На остальные вопросы отвечай честно и профессионально.\n5. ВСЕГДА отвечай на том языке, на котором пишет пользователь.\n6. Представляйся как Антон.";

var API_KEY = "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";

var CHANNELS = {
  web:      { label: "Web Сайт",  icon: "🌐" },
  whatsapp: { label: "WhatsApp",  icon: "📱" },
  instagram:{ label: "Instagram", icon: "📸" }
};

var activeChannel = "web";
var conversations = { web: [], whatsapp: [], instagram: [] };
var isLoading = false;

function fmt(d) {
  return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}

function switchChannel(ch) {
  activeChannel = ch;
  document.querySelectorAll(".ch-btn").forEach(function(b){
    b.classList.toggle("active", b.dataset.ch === ch);
  });
  document.getElementById("ch-icon").textContent = CHANNELS[ch].icon;
  document.getElementById("ch-title").textContent = CHANNELS[ch].label;
  renderAll();
}

function renderAll() {
  var msgs = conversations[activeChannel];
  var container = document.getElementById("msgs");
  container.querySelectorAll(".mrow").forEach(function(el){ el.remove(); });
  var typing = document.getElementById("typing-row");
  if (typing) typing.remove();
  document.getElementById("empty").style.display = msgs.length === 0 ? "flex" : "none";
  msgs.forEach(function(m){ addMsgEl(m); });
  if (isLoading) showTyping();
  scrollDown();
  updateStats();
}

function addMsgEl(msg) {
  var isUser = msg.role === "user";
  var container = document.getElementById("msgs");
  var row = document.createElement("div");
  row.className = "mrow" + (isUser ? " u" : "");
  if (isUser) {
    row.innerHTML = '<div class="mbub"><div class="mtxt u">' + esc(msg.content) + '</div><div class="mtime u">' + fmt(msg.time) + '</div></div><div class="mav u">👤</div>';
  } else {
    row.innerHTML = '<div class="mav">А</div><div class="mbub"><div class="mtxt">' + esc(msg.content) + '</div><div class="mtime">' + fmt(msg.time) + '</div></div>';
  }
  container.appendChild(row);
}

function showTyping() {
  var container = document.getElementById("msgs");
  var old = document.getElementById("typing-row");
  if (old) old.remove();
  var el = document.createElement("div");
  el.id = "typing-row";
  el.className = "mrow";
  el.innerHTML = '<div class="mav">А</div><div id="typing-bub"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  container.appendChild(el);
  scrollDown();
}

function hideTyping() {
  var el = document.getElementById("typing-row");
  if (el) el.remove();
}

function scrollDown() {
  var m = document.getElementById("msgs");
  m.scrollTop = m.scrollHeight;
}

function updateStats() {
  var total = 0;
  Object.keys(conversations).forEach(function(ch) {
    var count = conversations[ch].length;
    total += count;
    document.getElementById("cnt-" + ch).textContent = count + " сообщ.";
    var bdg = document.getElementById("bdg-" + ch);
    if (count > 0) { bdg.style.display = "inline"; bdg.textContent = count; }
    else bdg.style.display = "none";
  });
  document.getElementById("stat-msgs").textContent = total;
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 100) + "px";
  document.getElementById("send-btn").disabled = !el.value.trim() || isLoading;
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  var input = document.getElementById("msg-input");
  var text = input.value.trim();
  if (!text || isLoading) return;

  var userMsg = { role: "user", content: text, time: new Date() };
  conversations[activeChannel].push(userMsg);
  input.value = "";
  input.style.height = "auto";
  document.getElementById("send-btn").disabled = true;
  document.getElementById("empty").style.display = "none";
  addMsgEl(userMsg);
  updateStats();

  isLoading = true;
  showTyping();

  try {
    var apiMessages = conversations[activeChannel].map(function(m){
      return { role: m.role, content: m.content };
    });
    var res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Requested-With": "XMLHttpRequest"
      },
      body: JSON.stringify({
        model: "meta-llama/llama-3.3-70b-instruct:free",
        max_tokens: 1000,
        messages: [{ role: "system", content: SYSTEM_PROMPT }].concat(apiMessages)
      })
    });
    var data = await res.json();
    var reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "Ошибка.";
    hideTyping();
    var botMsg = { role: "assistant", content: reply, time: new Date() };
    conversations[activeChannel].push(botMsg);
    addMsgEl(botMsg);
    updateStats();
    scrollDown();
  } catch(e) {
    hideTyping();
    var errMsg = { role: "assistant", content: "Ошибка соединения. Попробуйте ещё раз.", time: new Date() };
    conversations[activeChannel].push(errMsg);
    addMsgEl(errMsg);
    updateStats();
    scrollDown();
  }
  isLoading = false;
  document.getElementById("send-btn").disabled = false;
}
</script>
</body>
</html>
